<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="wrapper">
      <div class="form-side">
        <img src="brand-logo.png" alt="logo" class="logo-img" />
        <h1 class="form-heading">Log into your Account</h1>
        <div class="input-fields">
          <div class="input-box">
            <img src="icon-mail.svg" />
            <input type="text" placeholder="iamchis_wallace@email.com" />
          </div>
          <div class="input-box">
            <img src="icon-password.svg" alt="lock" />
            <input type="text" placeholder="Password"/>
            <img src="icon-show-password.svg" alt="eye" />
          </div>
          <p class="forgot-text">Forgot Password?</p>
        </div>
        <div class="bottom-group">
          <button class="sign-in-btn">Sign in</button>
          <div class="or-divider">
            <div class="divider-line"></div>
            <p>or</p>
            <div class="divider-line"></div>
          </div>
          <div class="social-list">
            <div class="social-item">
              <img src="icon-google.svg" alt="" />
              <p>Sign in with Google</p>
            </div>
            <div class="social-item">
              <img src="icon-facebook.svg" alt="" />
              <p>Sign in with Facebook</p>
            </div>
            <div class="social-item">
              <img src="icon-apple.svg" alt="" />
              <p>Sign in with Apple</p>
            </div>
          </div>
          <div class="create-account">
            <p>Don’t have an account?</p>
            <a href="">Create Account</a>
          </div>
        </div>
      </div>
      <div class="image-side"></div>
    </div>
  </body>
</html>
